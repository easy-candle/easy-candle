name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # NSIS only — AppX/MSIX is built locally for Microsoft Store (yarn dist:win:appx).
            builder_args: --win nsis
            artifact: windows
          - os: macos-latest
            builder_args: --mac
            artifact: macos
          - os: ubuntu-latest
            builder_args: --linux
            artifact: linux

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      EASY_CANDLE_API_URL: ${{ vars.EASY_CANDLE_API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Snapshot contributors
        run: yarn fetch-contributors
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Require production API URL
        shell: bash
        run: |
          if [ -z "$EASY_CANDLE_API_URL" ]; then
            echo "::error::Set repository variable EASY_CANDLE_API_URL (e.g. https://api.easycandle.app)"
            exit 1
          fi
          echo "API origin: $EASY_CANDLE_API_URL"

      - name: Build (no publish)
        run: yarn build && yarn electron-builder ${{ matrix.builder_args }} --publish never

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.zip
            release/*.AppImage
            release/*.dmg
            release/*.blockmap
            release/*.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download all dist artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: dist-*

      - name: List release files
        run: ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-readme:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update README download links
        run: |
          export VERSION="$(node -p "require('./package.json').version")"
          python3 - <<'EOF'
          import os, re

          version = os.environ["VERSION"]
          path = "README.md"
          with open(path, encoding="utf-8") as f:
              content = f.read()

          content = re.sub(
              r"easy-candle-[0-9][0-9a-z.\-]*-setup\.exe",
              f"easy-candle-{version}-setup.exe",
              content,
          )
          content = re.sub(
              r"easy-candle-[0-9][0-9a-z.\-]*-arm64-mac\.zip",
              f"easy-candle-{version}-arm64-mac.zip",
              content,
          )
          content = re.sub(
              r"easy-candle-[0-9][0-9a-z.\-]*\.AppImage",
              f"easy-candle-{version}.AppImage",
              content,
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          EOF

      - name: Commit README update
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update README download links to ${{ github.ref_name }}"
