name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder_args: --win
          - os: macos-latest
            builder_args: --mac
          - os: ubuntu-latest
            builder_args: --linux

    runs-on: ${{ matrix.os }}
    # Mac packaging is still the slowest leg; give it enough headroom after reducing targets.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn build && yarn electron-builder ${{ matrix.builder_args }} --publish always
