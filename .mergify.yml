queue_rules:
  - name: default
    queue_conditions:
      - "#approved-reviews-by>=1"
      - -draft
    merge_conditions: []
    merge_method: merge

merge_protections_settings:
  auto_merge_conditions: true

merge_protections:
  - name: require-approval
    if: true
    success_conditions:
      - "#approved-reviews-by>=1"
      - -draft
