queue_rules:
  - name: default
    queue_conditions:
      - "#approved-reviews-by>=1"
      - -draft
      - check-success = build
    merge_conditions:
      - check-success = build
    merge_method: merge

merge_protections_settings:
  auto_merge_conditions: true

merge_protections:
  - name: require-approval
    if: true
    success_conditions:
      - "#approved-reviews-by>=1"
      - -draft
  - name: require-build
    if: true
    success_conditions:
      - check-success = build
