<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Easy Candle</title>
    <!--
      Web build talks to Binance directly from the browser (see lib/webApiBridge.ts),
      so connect-src must allow both klines bases. The desktop build fetches in the
      main process instead and keeps the stricter policy in src/renderer/index.html.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.binance.com https://data-api.binance.vision; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <link rel="icon" type="image/svg+xml" href="/src/renderer/src/assets/easycandle-icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/src/main.tsx"></script>
  </body>
</html>
