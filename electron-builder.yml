appId: com.easycandle.app
productName: Easy Candle
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,yarn.lock}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,vitest.config.ts}'
  - '!**/*.{test,spec}.{js,ts,jsx,tsx}'
asarUnpack:
  - resources/**
win:
  executableName: EasyCandle
  # Default Windows target for CI / GitHub Releases — NSIS only.
  # Build AppX locally with: yarn dist:win:appx (do not add appx here).
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: easy-candle-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
# Local Microsoft Store package only (yarn dist:win:appx).
# Identity from Partner Center (Store ID 9N91GNR9SJ14).
appx:
  artifactName: easy-candle-${version}-${arch}.${ext}
  applicationId: EasyCandle
  identityName: sepocim.EasyCandle
  publisher: CN=29159D27-EC61-45F2-861A-38FB99ACA328
  publisherDisplayName: sepocim
  displayName: Easy Candle
  languages:
    - en-US
  backgroundColor: '#18181b'
  capabilities:
    - runFullTrust
    - internetClient
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  # zip only — required by electron-updater; arm64 covers current macos-latest runners
  target:
    - target: zip
      arch:
        - arm64
  artifactName: easy-candle-${version}-${arch}-mac.${ext}
linux:
  target:
    - target: AppImage
      arch:
        - x64
  maintainer: Easy Candle
  category: Finance
appImage:
  artifactName: easy-candle-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: easy-candle
  repo: easy-candle
  releaseType: release
