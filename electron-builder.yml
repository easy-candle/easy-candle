appId: com.easycandle.app
productName: Easy Candle
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,yarn.lock}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,vitest.config.ts}'
  - '!**/*.{test,spec}.{js,ts,jsx,tsx}'
asarUnpack:
  - resources/**
win:
  executableName: EasyCandle
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  # zip only — required by electron-updater; arm64 covers current macos-latest runners
  target:
    - target: zip
      arch:
        - arm64
  artifactName: ${name}-${version}-${arch}-mac.${ext}
linux:
  target:
    - target: AppImage
      arch:
        - x64
  maintainer: Easy Candle
  category: Finance
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: easy-candle
  repo: easy-candle
  releaseType: release
